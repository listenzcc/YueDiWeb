<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS 文件上传管理系统</title>

    <!-- Download the script to the local -->
    <!-- <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.1.min.js"></script> -->
    <script src="/js/aliyun-oss-sdk-6.17.1.min.js"></script>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <div class="container">
        <header>
            <h1>📁 OSS 文件上传管理系统</h1>
            <p>安全高效的大文件上传解决方案</p>
        </header>

        <nav>
            <button onclick="showSection('auth')">登录/注册</button>
            <button onclick="showSection(['departmentInfo','upload'])" id="uploadBtn" class="hidden">上传文件</button>
            <button onclick="showSection('files')" id="filesBtn" class="hidden">文件管理</button>
            <button onclick="showSection('profile')" id="profileBtn" class="hidden">个人中心</button>
            <button onclick="logout()" id="logoutBtn" class="hidden" style="background: #e53e3e;">退出登录</button>
        </nav>

        <div class="content">
            <!-- 认证区域 -->
            <div id="authSection" class="card">
                <h2 style="margin-bottom: 20px;">用户登录 / 注册</h2>
                <div id="authMessage" class="message hidden"></div>

                <div id="loginForm">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="loginEmail" placeholder="输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="输入密码">
                    </div>
                    <button onclick="login()">登录</button>
                    <button onclick="showRegister()" style="background: #48bb78; margin-left: 10px;">注册新账户</button>
                </div>

                <div id="registerForm" class="hidden">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" placeholder="输入用户名">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" placeholder="输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" placeholder="至少6位密码">
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="regConfirmPassword" placeholder="再次输入密码">
                    </div>
                    <button onclick="register()">注册</button>
                    <button onclick="showLogin()" style="background: #718096; margin-left: 10px;">返回登录</button>
                </div>
            </div>

            <div id="departmentInfoSection" class="card hidden">
                <h2 style="margin-bottom: 20px">单位及患者信息</h2>
                <div class="user-info">
                    <span>
                        <strong id="departmentStrong">单位</strong>
                        <input type="text" name="department" id="departmentInput" placeholder="单位名称">
                    </span>
                    <span>
                        <strong id="unitStrong">科室</strong>
                        <input type="text" name="unit" id="unitInput" placeholder="科室名称">
                    </span>
                    <span>
                        <strong id="subjectStrong">患者</strong>
                        <input type="text" name="subject" id="subjectInput" placeholder="患者姓名">
                    </span>
                </div>
            </div>

            <!-- 上传区域 -->
            <div id="uploadSection" class="card hidden">

                <h2 style="margin-bottom: 20px">上传文件</h2>
                <div id="uploadMessage" class="message hidden"></div>

                <div class="user-info">
                    <div>
                        <strong>欢迎，<span id="currentUser">用户</span></strong>
                        <div id="storageStatus">存储空间：0GB / 10GB</div>
                    </div>
                    <div class="storage-info">
                        <div class="storage-bar">
                            <div class="storage-used" id="storageBar"></div>
                        </div>
                    </div>
                </div>

                <div class="upload-area" id="dropArea" ondragover="handleDragOver(event)"
                    ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                    <div style="font-size: 48px; margin-bottom: 20px;">📤</div>
                    <h3>拖拽文件到此处上传</h3>
                    <p style="color: #6c757d; margin: 10px 0;">支持单个或多个文件，最大 10GB</p>
                    <input type="file" id="fileInput" multiple style="display: none;"
                        onchange="handleFileSelect(event)">
                    <button onclick="document.getElementById('fileInput').click()">选择文件</button>
                </div>

                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div id="progressText">准备上传...</div>
                </div>

                <div id="fileList" class="file-list"></div>
            </div>

            <!-- 文件管理区域 -->
            <div id="filesSection" class="card hidden">
                <h2 style="margin-bottom: 20px;">文件管理</h2>
                <div id="filesMessage" class="message hidden"></div>

                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="searchInput" placeholder="搜索文件名..." style="flex: 1;">
                    <button onclick="searchFiles()">搜索</button>
                    <button onclick="refreshFiles()">刷新</button>
                </div>

                <div id="filesContainer">
                    加载中...
                </div>
            </div>

            <!-- 个人中心区域 -->
            <div id="profileSection" class="card hidden">
                <h2 style="margin-bottom: 20px;">个人中心</h2>
                <div id="profileMessage" class="message hidden"></div>

                <div class="user-info" style="margin-bottom: 30px;">
                    <div>
                        <strong id="profileUsername">用户名</strong>
                        <div id="profileEmail">邮箱：加载中...</div>
                    </div>
                </div>

                <h3 style="margin-bottom: 15px;">修改密码</h3>
                <div class="form-group">
                    <label>当前密码</label>
                    <input type="password" id="currentPassword" placeholder="输入当前密码">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword" placeholder="输入新密码（至少6位）">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="confirmNewPassword" placeholder="再次输入新密码">
                </div>
                <button onclick="changePassword()">修改密码</button>
            </div>
        </div>
    </div>

    <script src="/js/login-and-upload.js"></script>

</body>

</html>
